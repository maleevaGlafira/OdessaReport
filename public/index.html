<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Тестовая страница</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h2>Параметры отчета</h2>
        <form id="reportForm">
          <div class="form-grid">
            <div class="form-group">
              <label>PRINAD1</label>
              <input type="number" id="prinad1" value="0" required />
            </div>
            <div class="form-group">
              <label>PRINAD2</label>
              <input type="number" id="prinad2" value="0" required />
            </div>
            <div class="form-group">
              <label>DT_BEGIN</label>
              <input type="datetime-local" id="dt_begin" required />
            </div>
            <div class="form-group">
              <label>DT_FINISH</label>
              <input type="datetime-local" id="dt_finish" required />
            </div>
            <div class="form-group">
              <label>NUMBERS</label>
              <input type="number" id="numbers" value="0" required />
            </div>
          </div>
          <div class="btn-group">
            <button type="submit" id="submitBtn">Сформировать отчет</button>
            <button type="button" id="excelBtn" disabled>
              Выгрузить в Excel
            </button>
          </div>
        </form>
        <div id="status" class="status-message"></div>
      </div>

      <!-- Секция с таблицей результатов -->
      <div class="card table-card" id="resultCard" style="display: none">
        <div class="table-header">
          <h3>Результаты (<span id="totalRows">0</span>)</h3>
          <div class="pagination">
            <button id="prevPage">◀</button>
            <span
              >Стр. <span id="currentPage">1</span> из
              <span id="totalPages">1</span></span
            >
            <button id="nextPage">▶</button>
          </div>
        </div>
        <div class="table-wrapper">
          <table id="dataTable">
            <thead>
              <tr>
                <th>Номер</th>
                <th>Дата/Время</th>
                <th>Район</th>
                <th>Адрес</th>
                <th>Владелец</th>
                <th>Содержание</th>
                <th>Кол-во выездов</th>
                <th>Всего по адресу</th>
                <th>Доп. информация</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="/js/app.js"></script>
  </body>
</html>
